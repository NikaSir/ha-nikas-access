name: Validate integration

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate generated bundle
        run: node scripts/build.mjs --check
      - name: Check JavaScript syntax and frontend contract
        run: |
          node --check custom_components/nikas_access/frontend/nikas-access-panel.js
          node scripts/check-panel.mjs
      - name: Run Python contract tests
        run: python -m unittest discover -s tests -v
      - name: Run repository checks
        run: python scripts/check_repository.py
