name: Validate integration

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  repository-checks:
    name: repository-checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Validate generated bundle
        run: node scripts/build.mjs --check
      - name: Check JavaScript syntax and frontend contract
        run: |
          node --check custom_components/nikas_access/frontend/nikas-access-panel.js
          node scripts/check-panel.mjs
      - name: Run Python contract tests
        run: python -m unittest discover -s tests -v
      - name: Run repository checks
        run: python scripts/check_repository.py
      - name: Check hierarchical title navigation
        run: node tests/title_navigation.test.mjs

  hacs:
    name: hacs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate HACS integration repository
        uses: hacs/action@main
        with:
          category: integration
          comment: false

  hassfest:
    name: hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Home Assistant integration
        uses: home-assistant/actions/hassfest@master

  validate:
    name: validate
    if: ${{ always() }}
    needs: [repository-checks, hacs, hassfest]
    runs-on: ubuntu-latest
    steps:
      - name: Require every validation job to pass
        shell: bash
        env:
          NIKAS_JOB_RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PYGATE'
          import json
          import os
          import sys

          required = {"repository-checks", "hacs", "hassfest"}
          results = json.loads(os.environ["NIKAS_JOB_RESULTS"])
          if set(results) != required:
              sys.exit("Required CI job results are missing or unexpected")
          failed = {
              name: results[name].get("result")
              for name in sorted(required)
              if results[name].get("result") != "success"
          }
          if failed:
              sys.exit(f"Required CI jobs did not succeed: {failed}")
          print("All required CI jobs succeeded.")
          PYGATE
