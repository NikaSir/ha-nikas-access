name: Apply A08 reconnect patch

on:
  push:
    branches:
      - fix/a08-reconnect-lifecycle

permissions:
  contents: write

jobs:
  patch-build-test:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply exact patch
        run: python scripts/apply_a08_reconnect_patch.py
      - name: Rebuild canonical bundle
        run: node scripts/build.mjs
      - name: Run repository checks
        run: npm test
      - name: Remove one-shot machinery and commit result
        run: |
          git rm scripts/apply_a08_reconnect_patch.py .github/workflows/apply-a08-reconnect.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix Access reconnect lifecycle (A08)"
          git push origin HEAD:fix/a08-reconnect-lifecycle
